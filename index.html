<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f3" />

    <title>Lynn Kawqge — Digital Creator</title>
    <meta
      name="description"
      content="Media kit of Lynn Kawqge, digital creator. Short vertical videos with products actually being used: motherhood, daily life, unboxing, skincare, getting ready and travel. In Arabic, English and German."

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lynn Kawqge — Digital Creator" />

      property="og:description"
      content="Media kit: about, audience and what I can make for you."

    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!--
      Structured data: helps search engines understand who the site belongs to
      and what is offered. Update alongside src/content/site.ts.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Lynn Kawqge — Digital Creator",
        "description": "Digital creator. Short product videos for brands, around motherhood, daily life, unboxing, skincare, getting ready and travel.",
        "url": "https://lynn-portfolio.com/",
        "areaServed": "Worldwide",
        "address": { "@type": "PostalAddress", "addressLocality": "Hamburg", "addressCountry": "DE" },
        "availableLanguage": ["Arabic", "English", "German"],
        "serviceType": [
          "Short product videos",
          "Everyday lifestyle content",
          "UGC-style videos",
          "Product photos",
          "Editing"
        ]
      }
    </script>
  </head>

    <div id="root"></div>
