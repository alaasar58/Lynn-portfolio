name: Deploy to GitHub Pages

on:
  push:
    # GitHub only accepts a Pages deployment from the branch configured as the
    # Pages source (Settings → Pages). That is currently the working branch, so
    # both are listed: whichever one is the configured source will publish, and
    # the other run is rejected harmlessly. Trim this list once the source
    # branch is settled.
    branches:
      - main
      - claude/lifestyle-creator-portfolio-ehmgc6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # The site answers on lynn-portfolio.com, which serves it from the
          # root. It used to be a project site under /Lynn-portfolio/, and the
          # asset paths have to follow: built with the old value, every script
          # and stylesheet link points at /Lynn-portfolio/... and 404s on the
          # custom domain, which is a blank white page.
          #
          # public/CNAME is what tells GitHub the domain, and it has to be in
          # the published output — which is why it lives under public/ and not
          # in the repository root.
          VITE_BASE: /
          VITE_FORM_ENDPOINT: ${{ secrets.VITE_FORM_ENDPOINT }}
        run: npm run build

      # Everything under public/media is published as uploaded unless it is
      # recompressed here. Doing it on the built output rather than committing
      # the small version back means a heavy file can be uploaded once and
      # forgotten about, with no second workflow run needed to make it live.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Optimise media
        run: npm run media:optimize

      # Prints how Pages is currently configured. If `build_type` is not
      # "workflow", publishing is rejected before the deploy job starts and the
      # source has to be switched under Settings → Pages → Source. GITHUB_TOKEN
      # is not permitted to change that setting, so this only reports it.
      - name: Report Pages configuration
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/pages"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
