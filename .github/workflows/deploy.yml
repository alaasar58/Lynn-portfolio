name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Project sites are served from /<repo>/. Set this to "/" once a
          # custom domain is connected — no code changes required.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_FORM_ENDPOINT: ${{ secrets.VITE_FORM_ENDPOINT }}
        run: npm run build

      # A repository can already have Pages switched on with a *branch* source.
      # `configure-pages` only creates a missing site, it never changes an
      # existing one — and with a branch source the deploy job below is
      # rejected before it starts. Setting build_type=workflow first makes the
      # source GitHub Actions, whether or not Pages already existed.
      - name: Point Pages at GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${{ github.repository }}/pages" \
            -f build_type=workflow ||
          gh api --method POST "repos/${{ github.repository }}/pages" \
            -f build_type=workflow

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
